# Per-Minecraft-version properties, read in build.gradle.kts via sc.properties.
# Shared properties (mod version, loader, Kotlin) stay in gradle.properties.

["26.1.2"]
mod.mc_compat = "~26.1.2"
deps.fabric_api = "0.155.3+26.1.2"
# NanoVG must match the LWJGL version Minecraft ships.
deps.nanovg = "3.4.1"

["26.2"]
mod.mc_compat = "~26.2"
deps.fabric_api = "0.161.0+26.2"
deps.nanovg = "3.4.1"

["26.3"]
mod.mc_compat = "~26.3"
deps.fabric_api = "0.165.0+26.3"
deps.nanovg = "3.4.3"
